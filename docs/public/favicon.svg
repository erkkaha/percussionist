<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shellShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a34a0e"/>
      <stop offset="0.45" stop-color="#8a380b"/>
      <stop offset="1" stop-color="#5e2208"/>
    </linearGradient>
    <clipPath id="shellClip">
      <path d="M12 35 H52 V47 A20 7.5 0 0 1 12 47 Z"/>
    </clipPath>
  </defs>

  <rect width="64" height="64" rx="12" fill="#fbbf24"/>

  <!-- shell, with tension rods and bottom hoop trimmed to the cylinder -->
  <g clip-path="url(#shellClip)">
    <rect x="10" y="30" width="44" height="28" fill="url(#shellShade)"/>
    <g stroke="#c26a10" stroke-width="1.6">
      <path d="M18.5 32 V56"/>
      <path d="M27.5 32 V56"/>
      <path d="M36.5 32 V56"/>
      <path d="M45.5 32 V56"/>
    </g>
    <path d="M12 44 A20 7.5 0 0 0 52 44 V60 H12 Z" fill="#d97706"/>
  </g>
  <path d="M12 35 H52 V47 A20 7.5 0 0 1 12 47 Z" fill="none" stroke="#4a1a06" stroke-width="1.5"/>

  <!-- batter head -->
  <ellipse cx="32" cy="35" rx="20" ry="7.5" fill="#d97706" stroke="#4a1a06" stroke-width="1.5"/>
  <ellipse cx="32" cy="35" rx="15.5" ry="5" fill="#fef3c7"/>

  <!-- sticks, tips resting on the head -->
  <g stroke="#451a03" stroke-width="2.8" stroke-linecap="round" fill="#451a03">
    <path d="M15 14 L40 32"/>
    <circle cx="40" cy="32" r="2.2" stroke="none"/>
    <path d="M49 14 L24 32"/>
    <circle cx="24" cy="32" r="2.2" stroke="none"/>
  </g>
</svg>
