apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clustersettings.percussionist.dev
spec:
  group: percussionist.dev
  names:
    kind: ClusterSettings
    plural: clustersettings
    singular: clustersettings
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                secrets:
                  type: object
                  properties:
                    llmKeysSecret:
                      type: string
                    authSecret:
                      type: object
                      properties:
                        name:
                          type: string
                          minLength: 1
                        key:
                          default: auth.json
                          type: string
                      required:
                        - name
                        - key
                    configMap:
                      type: object
                      properties:
                        name:
                          type: string
                          minLength: 1
                        key:
                          default: opencode.json
                          type: string
                      required:
                        - name
                        - key
                runnerConfig:
                  type: object
                  properties:
                    config:
                      type: string
                    configMapRef:
                      type: object
                      properties:
                        name:
                          type: string
                          minLength: 1
                        key:
                          default: opencode.json
                          type: string
                      required:
                        - name
                        - key
                manager:
                  type: object
                  properties:
                    agentName:
                      default: manager-agent
                      type: string
                    model:
                      type: string
                    decisionAgentContent:
                      type: string
                      maxLength: 102400
                    timeoutMs:
                      default: 30000
                      type: integer
                      minimum: 0
                      exclusiveMinimum: true
                      maximum: 9007199254740991
                    firstResponseTimeoutMs:
                      type: integer
                      minimum: 0
                      exclusiveMinimum: true
                      maximum: 9007199254740991
                  required:
                    - agentName
                    - timeoutMs
                runner:
                  type: object
                  properties:
                    image:
                      default: ghcr.io/erkkaha/percussionist/runner:latest
                      type: string
                    timeoutSeconds:
                      default: 3600
                      type: integer
                      minimum: 0
                      exclusiveMinimum: true
                      maximum: 9007199254740991
                    resources:
                      type: object
                      properties:
                        requests:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                        limits:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                  required:
                    - image
                    - timeoutSeconds
                runTTLDays:
                  default: 7
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                  maximum: 9007199254740991
                dispatcher:
                  type: object
                  properties:
                    image:
                      type: string
                runnerAdapter:
                  type: object
                  properties:
                    image:
                      type: string
                    port:
                      type: integer
                      minimum: 1
                      maximum: 65535
                    command:
                      type: array
                      items:
                        type: string
                    authEnvVar:
                      type: string
                    configEnvVar:
                      type: string
                    baseUrlEnvVar:
                      type: string
                    configMountPath:
                      type: string
                    agentsDirRelative:
                      type: string
                    configMapKey:
                      type: string
                codeServerUrlTemplate:
                  type: string
              required:
                - runTTLDays
          required:
            - spec
