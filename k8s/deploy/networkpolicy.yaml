# NetworkPolicies restricting who may reach the control-plane services.
#
# These are ingress allowlists on the sensitive pods (manager MCP/chat and the
# per-project memory services). They exist to stop an untrusted, AI-driven
# runner pod from reaching the manager's destructive MCP tools or poisoning a
# project's vector memory over the pod network — defense-in-depth alongside the
# manager's bearer-token check.
#
# NOTE: enforcement requires a CNI that implements NetworkPolicy (Calico,
# Cilium, etc.). The default kind/minikube CNI does NOT enforce them, in which
# case these are documentation and the bearer token is the effective control.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: manager-ingress
  namespace: percussionist
  labels:
    app.kubernetes.io/name: percussionist
    app.kubernetes.io/component: manager
spec:
  # Target the manager pod (serves MCP :4097 and chat :4098).
  podSelector:
    matchLabels:
      app.kubernetes.io/name: percussionist
      app.kubernetes.io/component: manager
  policyTypes:
    - Ingress
  ingress:
    # Restrict the MCP port (4097) — it carries the destructive tool surface
    # (exec_in_workspace, apply_upgrade, delete_run). Only the web dashboard and
    # the manager itself may reach it; runner pods
    # (percussionist.dev/component: runner) are not selected, so they are denied.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: percussionist
              app.kubernetes.io/component: web
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: percussionist
              app.kubernetes.io/component: manager
      ports:
        - protocol: TCP
          port: 4097
    # The chat port (4098) is reachable cluster-wide so `beatctl chat` keeps
    # working via `kubectl port-forward` (whose traffic originates from the
    # node/kubelet rather than an allowlisted pod — a pod-selector rule here
    # would break the CLI on any CNI that enforces NetworkPolicy, e.g. k3s).
    # Cross-pod callers must still present the MCP bearer token; loopback
    # (port-forward) is exempt. Prompts forwarded here drive privileged
    # same-pod MCP tools, so do not treat the open port as an open API.
    - ports:
        - protocol: TCP
          port: 4098
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: memory-service-ingress
  namespace: percussionist
  labels:
    app.kubernetes.io/name: percussionist
    app.kubernetes.io/component: memory-service
spec:
  # Target every per-project memory service pod (operator-created).
  podSelector:
    matchLabels:
      percussionist.dev/component: memory-service
  policyTypes:
    - Ingress
  ingress:
    # Only the manager reads/writes vector memory. Runner pods must not be able
    # to store poisoned "context" that later gets injected into agent prompts.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: percussionist
              app.kubernetes.io/component: manager
      ports:
        - protocol: TCP
          port: 4100
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: percussionist
  labels:
    app.kubernetes.io/name: percussionist
    app.kubernetes.io/component: postgres
spec:
  # Target the bundled PostgreSQL pod. The database holds every user's web stats,
  # auth sessions and vector memories, so it gets the same treatment as the MCP
  # surface: an allowlist of the components that legitimately hold a connection
  # string. Runner pods (percussionist.dev/component: runner) are not selected,
  # so an agent cannot query the database directly.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: percussionist
      app.kubernetes.io/component: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        # The dashboard (runs, messages, sessions, auth, stats).
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: percussionist
              app.kubernetes.io/component: web
        # Per-project memory services (one pod per project with embedding on).
        - podSelector:
            matchLabels:
              percussionist.dev/component: memory-service
        # Deliberately absent: the manager controller. It has no database
        # dependency and no DATABASE_URL — it reaches vector memory over HTTP
        # (:4100) and everything else through the Kubernetes API. Adding it here
        # would be a misleading allowance that invites "why is the manager
        # allowed to reach the database?" in a future review.
      ports:
        - protocol: TCP
          port: 5432
