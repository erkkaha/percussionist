# RBAC, Service, Deployment, and PVC for the percussionist web dashboard.
#
# The web server reads Run resources and pod logs, and also hosts
# the stats SQLite database (bun:sqlite) on a PersistentVolumeClaim.
# Dispatcher sidecars POST session data to /api/stats/session after each run.
#
# Stats configuration (env vars on the Deployment):
#   DATA_DIR        — path where percussionist.db is stored (default: /app/data)
#   RETENTION_DAYS  — delete sessions older than N days (default: 30; 0=forever)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: percussionist-web-db-v3
  namespace: percussionist
  labels:
    app.kubernetes.io/name: percussionist
    app.kubernetes.io/component: web
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: percussionist-web
  namespace: percussionist
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: percussionist-web
  namespace: percussionist
rules:
  # Read + write Run resources (list, detail, create, delete).
  - apiGroups: ["percussionist.dev"]
    resources: ["runs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # Read + write Project resources (list, detail, create, update, delete).
  - apiGroups: ["percussionist.dev"]
    resources: ["projects"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Patch Project status subresource (for board status updates from UI).
  - apiGroups: ["percussionist.dev"]
    resources: ["projects/status"]
    verbs: ["get", "patch"]
  # Read + write Task resources (board task CRs).
  - apiGroups: ["percussionist.dev"]
    resources: ["tasks"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Patch Task status subresource.
  - apiGroups: ["percussionist.dev"]
    resources: ["tasks/status"]
    verbs: ["get", "patch"]
  # Read pods (needed to resolve podName and read logs).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Read pod metrics (for observability view).
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Exec into runner pods (web terminal attach via WebSocket-bridged k8s exec).
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  # Read + write secrets (list for settings UI; get for auth; create/update/patch/delete for inject-file secrets).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # Read session snapshot ConfigMaps (fallback when live proxy is unavailable).
  # create/update/delete for per-project opencode config configmaps.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: percussionist-web
  namespace: percussionist
subjects:
  - kind: ServiceAccount
    name: percussionist-web
    namespace: percussionist
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: percussionist-web
---
# ClusterRole for cluster-scoped resources (ClusterAgents, ClusterSettings).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: percussionist-web-clusteragents
rules:
  - apiGroups: ["percussionist.dev"]
    resources: ["clusteragents", "clustersettings"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
# ClusterRole for node metrics (observability view) + node capacity.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: percussionist-web-nodemetrics
rules:
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"] # needed for kubelet /stats/summary (host-level memory)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: percussionist-web-clusteragents
subjects:
  - kind: ServiceAccount
    name: percussionist-web
    namespace: percussionist
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: percussionist-web-clusteragents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: percussionist-web-nodemetrics
subjects:
  - kind: ServiceAccount
    name: percussionist-web
    namespace: percussionist
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: percussionist-web-nodemetrics
---
apiVersion: v1
kind: Service
metadata:
  name: percussionist-web
  namespace: percussionist
  labels:
    app.kubernetes.io/name: percussionist
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: percussionist
    app.kubernetes.io/component: web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: percussionist-web
  namespace: percussionist
  labels:
    app.kubernetes.io/name: percussionist
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: percussionist
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: percussionist
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: percussionist-web
      containers:
        - name: web
          image: ghcr.io/erkkaha/percussionist/web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: WATCH_NAMESPACE
              value: percussionist
            - name: PORT
              value: "8080"
            - name: DATA_DIR
              value: /app/data
            # Number of days to retain session stats (0 = keep forever).
            - name: RETENTION_DAYS
              value: "30"
            # Public base URL. Must match the GitHub App's callback origin —
            # GitHub matches the redirect URI on host and port — and is also used
            # as the cookie/session origin. Change this and the GitHub App's
            # callback URL together.
            - name: WEB_BASE_URL
              value: http://app.192.168.49.2.nip.io
            # Session signing secret. Sessions are invalidated if this changes,
            # so it is generated once and kept. Manage with
            # `beatctl auth session-secret rotate`.
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: web-auth
                  key: session-secret
                  optional: true
            # GitHub App credentials — the only way a human signs in.
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: web-auth
                  key: github-client-id
                  optional: true
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: web-auth
                  key: github-client-secret
                  optional: true
            # Comma-separated GitHub logins permitted to sign in. Empty means
            # nobody can: the OAuth callback is otherwise open to every GitHub
            # account on the internet. Manage with `beatctl auth github allow`.
            - name: GITHUB_ALLOWED_LOGINS
              valueFrom:
                secretKeyRef:
                  name: web-auth
                  key: github-allowed-logins
                  optional: true
            # Bearer token for calling the manager's MCP server. Shared with the
            # manager pod only.
            - name: MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: manager-mcp-token
                  key: token
                  optional: true
            # Legacy shared-secret auth. Accepted IN ADDITION to sessions and API
            # keys while a cluster is mid-migration, so a rolling upgrade does not
            # break agents that still hold the old shared token. Remove this and
            # the "token" key from the web-auth Secret once every component has
            # been issued a key (`beatctl auth key list` to check).
            - name: LEGACY_TOKEN_AUTH
              valueFrom:
                secretKeyRef:
                  name: web-auth
                  key: legacy-token-auth
                  optional: true
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: web-auth
                  key: token
                  optional: true
            # Set to "1" to bypass auth entirely (dev mode).
            - name: AUTH_DISABLED
              valueFrom:
                secretKeyRef:
                  name: web-auth
                  key: disabled
                  optional: true
            # Bun's TLS stack does not pick up the in-cluster CA from the
            # @kubernetes/client-node https.Agent. Point it at the service
            # account CA bundle explicitly so Bun trusts the API server cert.
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 1Gi }
          volumeMounts:
            - name: percussionist-db
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: percussionist-db
          persistentVolumeClaim:
            claimName: percussionist-web-db-v3
---
# Dashboard Ingress — exposes the Percussionist web UI at a stable URL without
# kubectl port-forward. Relies on a Traefik ingress controller (the default on
# minikube's traefik addon and MicroK8s 1.35+). The nip.io wildcard DNS maps
# *.192.168.49.2.nip.io → 192.168.49.2 (default minikube IP), so the dashboard
# is reachable at:
#   http://app.192.168.49.2.nip.io/
#
# Traefik binds node port 80, so there is no :port suffix. For other cluster
# setups, replace the host value with the appropriate base domain, e.g.
# app.percussionist.localhost (ingress controller on 127.0.0.1:80). The
# WEB_BASE_URL env above must share this host's origin (scheme + host) so the
# dashboard's session cookies and GitHub App callback resolve.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: percussionist-web
  namespace: percussionist
  labels:
    app.kubernetes.io/name: percussionist
    app.kubernetes.io/component: web
spec:
  ingressClassName: traefik
  rules:
    - host: app.192.168.49.2.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: percussionist-web
                port:
                  number: 8080
