packages:
  - packages/*
  - docs

ignoredBuiltDependencies:
  - esbuild
  # Transitive deps of @opencode/sdk with install scripts. All ship prebuilt
  # binaries (or are optional accelerators); the runner-opencode spike ran with
  # scripts disabled on both glibc and musl.
  - "@parcel/watcher"
  - msgpackr-extract
  - protobufjs
  - tree-sitter-bash
  - tree-sitter-powershell

minimumReleaseAge: 10080
# OpenCode 2 ships several patch releases a week; the runner-opencode image is
# the only consumer and pins exact versions, so the quarantine buys nothing there.
minimumReleaseAgeExclude:
  - "@opencode/*"

# Transitive high-severity advisories with patches available in-range.
overrides:
  fast-uri: ">=3.1.4"
  form-data: ">=4.0.6"
  js-yaml: ">=4.3.1 <5"
  nanoid: ">=3.3.18 <4"
  postcss: ">=8.5.18"
  ws: ">=8.21.0"

auditConfig:
  ignoreGhsas:
    # vite server.fs.deny bypass — Windows-only dev-server issue; vitepress
    # stable (1.6.x) pins vite ^5.4 and the 5.x line has no patched release.
    - GHSA-fx2h-pf6j-xcff
    # react-router RSC-mode CSRF — web is a classic BrowserRouter SPA (no
    # RSC); the patch only exists in the react-router 8.3 major.
    - GHSA-qwww-vcr4-c8h2
trustPolicy: downgrade
trustedDependencies:
  - semver
blockExoticSubdeps: true
allowBuilds:
  esbuild: true
  # Transitive deps of @opencode/sdk (runner-opencode) with install scripts. All
  # ship prebuilt binaries or are optional accelerators; the runner spike ran
  # with scripts disabled on both glibc and musl.
  '@parcel/watcher': false
  msgpackr-extract: false
  protobufjs: false
  tree-sitter-bash: false
  tree-sitter-powershell: false
